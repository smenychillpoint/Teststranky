<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Rezervácie · ChillPoint</title>
  <meta name="theme-color" content="#0a0c0f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://chillpoint-smeny-350c4-default-rtdb.europe-west1.firebasedatabase.app">
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
  <style>
    :root{--yellow:#f5bb16;--black:#0a0c0f;--panel:#17191d;--line:#34373c;--muted:#a7a9ad;--white:#fff;--red:#ff6c6c;--green:#5fd67a;--blue:#6fb3ff}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--black);color:var(--white);font-family:Arial,Helvetica,sans-serif;overflow-x:clip}
    .wrap{width:min(640px,100% - 28px);margin:0 auto;padding:16px 0 40px}
    .top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
    .top a{color:var(--yellow);text-decoration:none;font-weight:700;font-size:14px}
    h1{font-size:24px;margin:0;flex:1;text-transform:uppercase}
    h1 small{font-size:11px;background:var(--blue);color:#111;padding:2px 6px;vertical-align:middle;letter-spacing:.05em}
    h2{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:20px 0 8px;text-transform:uppercase}
    .card{background:var(--panel);border:1px solid var(--line);padding:14px;margin-bottom:10px}
    .btn{background:var(--yellow);color:#111;border:0;font:inherit;font-weight:800;padding:11px 14px;cursor:pointer;text-transform:uppercase;letter-spacing:.03em;font-size:14px}
    .btn.sm{padding:7px 10px;font-size:12px}
    .btn.ghost{background:transparent;color:var(--white);border:1px solid var(--line)}
    .btn.red{background:transparent;color:var(--red);border:1px solid #7a3434}
    .btn:disabled{opacity:.5}
    input,select,textarea{width:100%;background:#0d0f11;color:#fff;border:1px solid #55585c;padding:10px;font:inherit;font-size:16px;margin-bottom:8px}
    textarea{min-height:60px;resize:vertical}
    label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
    .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
    .seg{display:flex;border:1px solid var(--line)}
    .seg button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;padding:8px 10px;cursor:pointer}
    .seg button.on{background:var(--yellow);color:#111;font-weight:800}
    .bk{border-left:5px solid var(--yellow)}
    .bk.st-confirmed{border-left-color:var(--green)}
    .bk.st-arrived{border-left-color:var(--blue);opacity:.8}
    .bk.st-cancelled{border-left-color:#555;opacity:.55}
    .bk .h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
    .bk .h b{font-size:17px}
    .tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;margin-left:4px;vertical-align:middle}
    .tag.new{background:var(--yellow);color:#111}.tag.confirmed{background:#1d4a2a;color:var(--green)}
    .tag.arrived{background:#173049;color:var(--blue)}.tag.cancelled{background:#333;color:#bbb}
    .tag.src{background:#26292d;color:var(--muted);font-weight:400}
    .times{font-size:15px;margin:6px 0;color:var(--yellow);font-weight:700}
    .info{font-size:14px;color:#d9dbde;line-height:1.55}
    .info a{color:var(--blue)}
    .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
    .day{font-size:13px;letter-spacing:.08em;color:var(--yellow);margin:18px 0 6px;text-transform:uppercase;font-weight:800}
    .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;margin:6px 0 10px}
    .slot{background:#0d0f11;border:1px solid var(--line);color:#fff;font:inherit;font-size:14px;padding:9px 0;cursor:pointer}
    .slot.picked{background:var(--yellow);color:#111;font-weight:800;border-color:var(--yellow)}
    .slot.busy{background:#3a1717;color:#ff9a9a;border-color:#6d2a2a;cursor:not-allowed}
    .slot.rest{color:var(--muted);border-style:dashed}
    .chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
    .chip{background:#26292d;border:1px solid var(--line);color:#fff;font:inherit;font-size:13px;padding:5px 8px;cursor:pointer}
    .empty{color:var(--muted);font-size:14px;padding:6px 0}
    .err{color:var(--red);font-size:13px;min-height:18px}
    .warn{background:#2a2410;border:1px solid #6b5a1a;color:#ffd66b;font-size:13px;padding:10px;margin-bottom:10px;line-height:1.45}
    footer{color:var(--muted);font-size:11px;opacity:.6;text-align:center;margin-top:28px}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--yellow);color:#111;font-weight:700;padding:10px 16px;z-index:9;max-width:90vw}
  </style>
</head>
<body>
  <div class="wrap" id="app"><p class="empty">Načítavam…</p></div>
  <script>
  // ===== 📆 REZERVÁCIE LASER GAME (beta, len vedúci) – 2026-10-25 =====
  // Rovnaké dáta ako rezervácia na webe (WordPress plugin chillpoint-rezervacie):
  //   laser/<env>/bookings/<id> = {name, phone, email, players, games:{"YYYY-MM-DD_HHMM":true}, consent, createdAt, status, note?, source?}
  //   laser/<env>/slots/<YYYY-MM-DD>/<HHMM> = <id>   ← web podľa toho ukazuje obsadené časy (červené)
  // env = 'test' | 'live' (podľa režimu pluginu). Zmeny tu (pridať / upraviť / zrušiť / zmazať) sa hneď prejavia na webe.
  const MANAGER_EMAIL = 'vedouci@chillpoint-smeny.sk';
  // rovnaké predvolené hodnoty ako v plugine (Nastavenia → Chillpoint rezervácie); keď sa tam zmenia, treba aj tu
  const B = { step: 20, game: 15, change: 5, rest: 40, minPlayers: 1, maxPlayers: 30,
    hours: { 1: ['15:00', '22:00'], 2: ['15:00', '22:00'], 3: ['15:00', '22:00'], 4: ['15:00', '22:00'], 5: ['15:00', '24:00'], 6: ['13:00', '24:00'], 0: ['13:00', '22:00'] } };
  const BLOCK = B.game + B.change;   // na koľko minút hra zablokuje arénu pre iné partie
  const STATUS = { new: '🆕 nová', confirmed: '✓ potvrdená', arrived: '🚶 prišli', cancelled: '✕ zrušená' };
  const DAY_NAMES = ['nedeľa', 'pondelok', 'utorok', 'streda', 'štvrtok', 'piatok', 'sobota'];

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  const toTime = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
  const dayTitle = k => { const d = new Date(k + 'T12:00:00'); return `${DAY_NAMES[d.getDay()]} ${d.getDate()}. ${d.getMonth() + 1}.`; };
  const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
  function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
  const blurNow = () => { try { document.activeElement && document.activeElement.blur(); } catch (e) {} };

  let env = ls.get('cp_laserEnv') === 'live' ? 'live' : 'test';
  let authReady = false, isMgr = false, bookings = {}, slots = {}, loaded = false, loadErr = '';
  let showOld = false, busyAct = false;
  // rozpísaný formulár (nie v DOM → živé prekreslenie ho nevymaže); f.id = úprava existujúcej, inak nová
  let f = null;

  // ---- pomocné nad dátami ----
  const gamesOf = b => Object.keys((b && b.games) || {}).filter(g => /^\d{4}-\d{2}-\d{2}_\d{4}$/.test(g)).sort()
    .map(g => ({ date: g.slice(0, 10), time: g.slice(11, 13) + ':' + g.slice(13, 15), key: g }));
  const firstGame = b => gamesOf(b)[0] || null;
  const todayKey = () => iso(new Date());
  function list() {
    const tk = todayKey();
    return Object.entries(bookings || {}).map(([id, b]) => ({ id, ...b })).filter(b => b && b.name && firstGame(b))
      .filter(b => showOld || (b.status !== 'cancelled' && gamesOf(b).some(g => g.date >= tk)))
      .sort((a, b) => (firstGame(a).date + firstGame(a).time).localeCompare(firstGame(b).date + firstGame(b).time));
  }
  function hoursFor(date) {
    const h = B.hours[new Date(date + 'T12:00:00').getDay()];
    return h ? [toMin(h[0]), toMin(h[1]) || 1440] : null;
  }
  function timesFor(date) {
    const h = hoursFor(date), out = [];
    if (!h) return out;
    for (let m = h[0]; m + B.game <= h[1]; m += B.step) out.push(toTime(m));
    // časy vybrané mimo bežnej mriežky (vlastný čas) tiež ukázať
    if (f) f.items.filter(it => it.date === date && !out.includes(it.time)).forEach(it => out.push(it.time));
    return out.sort();
  }
  // čas je obsadený inou partiou (aj prekrytie hry s výmenou – ako na webe)
  function busyBy(date, time, selfId) {
    const day = slots[date] || {}, t = toMin(time);
    for (const hm of Object.keys(day)) {
      if (day[hm] === selfId) continue;
      if (Math.abs(toMin(hm.slice(0, 2) + ':' + hm.slice(2)) - t) < BLOCK) return day[hm];
    }
    return null;
  }
  const restNear = (date, time) => f && f.items.some(it => it.date === date && it.time !== time && Math.abs(toMin(it.time) - toMin(time)) < B.rest);
  function normalizePhone(p) {
    p = String(p || '').replace(/[\s\-/()]/g, '');
    if (p.startsWith('00')) return '+' + p.slice(2);
    if (p.startsWith('0')) return '+421' + p.slice(1);
    return p;
  }
  const base = () => `laser/${env}`;

  // ---- akcie ----
  function setEnv(e) { if (e === env) return; env = e; ls.set('cp_laserEnv', e); f = null; watch(); render(); }
  async function setStatus(id, st) {
    if (busyAct) return; busyAct = true;
    try { await firebase.database().ref(`${base()}/bookings/${id}/status`).set(st); toast(STATUS[st]); }
    catch (e) { toast('Nepodarilo sa uložiť.'); }
    busyAct = false;
  }
  // uvoľní časy na webe, ktoré patria tejto rezervácii
  function freeSlotsPatch(u, id, b) {
    gamesOf(b).forEach(g => { const hm = g.key.slice(11); if ((slots[g.date] || {})[hm] === id) u[`${base()}/slots/${g.date}/${hm}`] = null; });
  }
  async function cancelBooking(id) {
    const b = bookings[id]; if (!b || busyAct) return;
    if (!confirm(`Zrušiť rezerváciu ${b.name}? Časy sa na webe uvoľnia.`)) return;
    busyAct = true;
    const u = {}; u[`${base()}/bookings/${id}/status`] = 'cancelled'; freeSlotsPatch(u, id, b);
    try { await firebase.database().ref().update(u); toast('Rezervácia zrušená, časy sú voľné'); }
    catch (e) { toast('Nepodarilo sa zrušiť.'); }
    busyAct = false;
  }
  async function deleteBooking(id) {
    const b = bookings[id]; if (!b || busyAct) return;
    if (!confirm(`Natrvalo zmazať rezerváciu ${b.name}?`)) return;
    busyAct = true;
    const u = {}; u[`${base()}/bookings/${id}`] = null; freeSlotsPatch(u, id, b);
    try { await firebase.database().ref().update(u); toast('Zmazané'); }
    catch (e) { toast('Nepodarilo sa zmazať.'); }
    busyAct = false;
  }
  function openForm(id) {
    const b = id ? bookings[id] : null;
    f = b ? { id, name: b.name || '', phone: b.phone || '', email: b.email || '', players: b.players || 2, note: b.note || '',
      items: gamesOf(b).map(g => ({ date: g.date, time: g.time })), day: (firstGame(b) || {}).date || todayKey(), err: '' }
      : { id: '', name: '', phone: '', email: '', players: 4, note: '', items: [], day: todayKey(), err: '' };
    render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function toggleSlot(date, time) {
    const i = f.items.findIndex(it => it.date === date && it.time === time);
    if (i >= 0) f.items.splice(i, 1);
    else if (busyBy(date, time, f.id)) { toast('Tento čas má iná partia.'); return; }
    else f.items.push({ date, time });
    f.items.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    render();
  }
  function addCustomTime() {
    const t = ($('fTime').value || '').trim(); blurNow();
    if (!/^\d{2}:\d{2}$/.test(t)) { toast('Zadaj čas, napr. 18:10.'); return; }
    if (f.items.some(it => it.date === f.day && it.time === t)) { render(); return; }
    toggleSlot(f.day, t);
  }
  async function saveForm() {
    blurNow();
    if (!f || busyAct) return;
    const name = f.name.trim(), phone = f.phone.trim() ? normalizePhone(f.phone.trim()) : '', email = f.email.trim(), players = parseInt(f.players, 10), note = f.note.trim().slice(0, 400);
    const fail = m => { f.err = m; render(); };
    if (name.length < 3) return fail('Meno musí mať aspoň 3 znaky.');
    if (phone && !/^\+?\d{9,15}$/.test(phone)) return fail('Telefón nie je v poriadku (napr. 0910 123 456).');
    if (email && !/^[^@ ]+@[^@ ]+[.][^@ ]+$/.test(email)) return fail('E-mail nie je v poriadku.');
    if (!(players >= B.minPlayers && players <= B.maxPlayers)) return fail(`Počet hráčov ${B.minPlayers}–${B.maxPlayers}.`);
    if (!f.items.length) return fail('Vyber aspoň jeden čas.');
    const clash = f.items.find(it => busyBy(it.date, it.time, f.id));
    if (clash) return fail(`Čas ${dayTitle(clash.date)} ${clash.time} medzitým obsadil niekto iný.`);
    const db = firebase.database(), id = f.id || db.ref(`${base()}/bookings`).push().key, u = {}, bp = `${base()}/bookings/${id}`;
    const games = {}; f.items.forEach(it => { games[it.date + '_' + it.time.replace(':', '')] = true; });
    if (f.id) {
      const old = bookings[f.id] || {};
      u[bp + '/name'] = name; u[bp + '/players'] = players; u[bp + '/games'] = games;
      u[bp + '/phone'] = phone || null; u[bp + '/email'] = email || null; u[bp + '/note'] = note || null;
      // staré časy, ktoré už nie sú vybrané, uvoľniť
      gamesOf(old).forEach(g => { if (!games[g.key]) { const hm = g.key.slice(11); if ((slots[g.date] || {})[hm] === f.id) u[`${base()}/slots/${g.date}/${hm}`] = null; } });
      if (old.status === 'cancelled') u[bp + '/status'] = 'confirmed';   // upravená zrušená = znova platí
    } else {
      // pozor: undefined do Firebase nesmie (pouč. #1) → nepovinné polia len keď sú
      u[bp] = { name, players, games, consent: true, createdAt: firebase.database.ServerValue.TIMESTAMP, status: 'confirmed', source: 'admin',
        ...(phone ? { phone } : {}), ...(email ? { email } : {}), ...(note ? { note } : {}) };
    }
    Object.keys(games).forEach(g => { u[`${base()}/slots/${g.slice(0, 10)}/${g.slice(11)}`] = id; });
    busyAct = true;
    try { await db.ref().update(u); toast(f.id ? 'Rezervácia upravená ✓' : 'Rezervácia pridaná ✓'); f = null; }
    catch (e) { console.error(e); f.err = String(e.code || e.message || '').toUpperCase().includes('PERMISSION')
      ? 'Firebase to nedovolil. Skontroluj, či sú vo Firebase vložené pravidlá pre „laser“ (pravidla-CELE-vlozit.json).' : 'Nepodarilo sa uložiť, skús znova.'; }
    busyAct = false; render();
  }

  // ---- vykreslenie ----
  function formHtml() {
    const d = f.day, times = timesFor(d);
    const slotBtn = t => {
      const picked = f.items.some(it => it.date === d && it.time === t), busy = !picked && busyBy(d, t, f.id), rest = !picked && !busy && restNear(d, t);
      return `<button class="slot ${picked ? 'picked' : busy ? 'busy' : rest ? 'rest' : ''}" onclick="toggleSlot('${d}','${t}')"${busy ? ' title="obsadené"' : ''}>${t}</button>`;
    };
    const quick = [0, 1, 2, 3, 4, 5, 6].map(n => { const x = new Date(); x.setDate(x.getDate() + n); const k = iso(x);
      return `<button class="chip" style="${k === d ? 'background:var(--yellow);color:#111;font-weight:800' : ''}" onclick="f.day='${k}';render()">${n === 0 ? 'Dnes' : n === 1 ? 'Zajtra' : DAY_NAMES[x.getDay()].slice(0, 2) + ' ' + x.getDate() + '.'}</button>`; }).join('');
    return `<div class="card" style="border-color:var(--yellow)">
      <h2 style="margin-top:0">${f.id ? '✎ Upraviť rezerváciu' : '➕ Nová rezervácia'}</h2>
      <label class="f">Meno</label><input id="fName" maxlength="80" value="${esc(f.name)}" oninput="f.name=this.value" placeholder="Meno a priezvisko">
      <div class="row2">
        <div><label class="f">Telefón (nepovinné)</label><input id="fPhone" type="tel" maxlength="30" value="${esc(f.phone)}" oninput="f.phone=this.value" placeholder="0910 123 456"></div>
        <div><label class="f">Počet hráčov</label><input id="fPlayers" type="number" inputmode="numeric" min="1" max="30" value="${esc(f.players)}" oninput="f.players=this.value"></div>
      </div>
      <label class="f">E-mail (nepovinné)</label><input id="fEmail" type="email" maxlength="100" value="${esc(f.email)}" oninput="f.email=this.value">
      <label class="f">Poznámka (nepovinné, web ju nevidí)</label><textarea id="fNote" maxlength="400" oninput="f.note=this.value" placeholder="napr. oslava, záloha, platí firma…">${esc(f.note)}</textarea>
      <label class="f">Deň</label>
      <div class="chips">${quick}</div>
      <input id="fDate" type="date" value="${d}" onchange="f.day=this.value||f.day;blurNow();render()">
      <div style="font-weight:800;margin:4px 0">${dayTitle(d)}${hoursFor(d) ? '' : ' · <span style="color:var(--red)">v tento deň je podľa webu zatvorené</span>'}</div>
      ${times.length ? `<div class="slots">${times.map(slotBtn).join('')}</div>` : '<div class="empty">Žiadne časy podľa otváracích hodín – pridaj vlastný čas nižšie.</div>'}
      <div class="row2" style="align-items:start"><input id="fTime" type="time" step="300" placeholder="18:10"><button class="btn ghost" onclick="addCustomTime()">+ Vlastný čas</button></div>
      <p class="empty" style="font-size:12px;margin:0 0 8px">Červené = má iná partia. Prerušované = menej ako ${B.rest} min od inej hry tejto partie (na webe by to nešlo, ty môžeš).</p>
      <div class="info"><b>Vybrané:</b> ${f.items.length ? f.items.map(it => `<button class="chip" onclick="toggleSlot('${it.date}','${it.time}')">${esc(dayTitle(it.date))} ${it.time} ✕</button>`).join(' ') : '<span style="color:var(--muted)">zatiaľ nič</span>'}</div>
      <div class="err">${esc(f.err)}</div>
      <div class="acts"><button class="btn" onclick="saveForm()">${f.id ? 'Uložiť zmeny' : 'Pridať rezerváciu'}</button><button class="btn ghost" onclick="f=null;render()">Zrušiť</button></div>
    </div>`;
  }
  function bookingHtml(b) {
    const st = STATUS[b.status] ? b.status : 'new', g = gamesOf(b);
    const created = typeof b.createdAt === 'number' ? new Date(b.createdAt) : null;
    const times = g.map(x => x.date === firstGame(b).date ? x.time : `${dayTitle(x.date)} ${x.time}`).join(' · ');
    return `<div class="card bk st-${st}">
      <div class="h"><span><b>${esc(b.name)}</b> <span class="tag ${st}">${STATUS[st]}</span>${b.source === 'admin' ? '<span class="tag src">zapísal vedúci</span>' : '<span class="tag src">z webu</span>'}</span>
        <span style="font-size:14px">👥 <b>${esc(b.players)}</b></span></div>
      <div class="times">🕹 ${esc(times)} <span style="color:var(--muted);font-weight:400;font-size:13px">(${g.length} ${g.length === 1 ? 'hra' : g.length < 5 ? 'hry' : 'hier'})</span></div>
      <div class="info">${b.phone ? `📞 <a href="tel:${esc(b.phone)}">${esc(b.phone)}</a>` : ''}${b.phone && b.email ? ' · ' : ''}${b.email ? `✉ <a href="mailto:${esc(b.email)}">${esc(b.email)}</a>` : ''}
        ${b.note ? `<div>📝 ${esc(b.note)}</div>` : ''}
        ${created ? `<div style="color:var(--muted);font-size:12px">vytvorené ${created.getDate()}. ${created.getMonth() + 1}. ${pad(created.getHours())}:${pad(created.getMinutes())}</div>` : ''}</div>
      <div class="acts">
        ${st === 'new' ? `<button class="btn sm" onclick="setStatus('${b.id}','confirmed')">✓ Potvrdiť</button>` : ''}
        ${st === 'new' || st === 'confirmed' ? `<button class="btn sm ghost" onclick="setStatus('${b.id}','arrived')">🚶 Prišli</button>` : ''}
        ${st === 'arrived' ? `<button class="btn sm ghost" onclick="setStatus('${b.id}','confirmed')">↺ Ešte neprišli</button>` : ''}
        <button class="btn sm ghost" onclick="openForm('${b.id}')">✎ Upraviť</button>
        ${st !== 'cancelled' ? `<button class="btn sm red" onclick="cancelBooking('${b.id}')">✕ Zrušiť</button>` : ''}
        <button class="btn sm red" onclick="deleteBooking('${b.id}')">🗑</button>
      </div></div>`;
  }
  function render() {
    // nerušiť písanie vo formulári pri živej zmene dát
    const ae = document.activeElement && document.activeElement.id;
    if (['fName', 'fPhone', 'fEmail', 'fPlayers', 'fNote', 'fTime', 'fDate'].includes(ae)) return;
    const app = $('app');
    let html = `<div class="top"><a href="./">‹ Úvod</a><h1>📆 Rezervácie <small>BETA</small></h1></div>`;
    if (!authReady) { app.innerHTML = html + '<p class="empty">Načítavam…</p>'; return; }
    if (!isMgr) {
      app.innerHTML = html + `<div class="card"><p style="margin:0 0 10px">Rezervácie sú zatiaľ v skúšobnej verzii a vidí ich len vedúci.</p><a class="btn" href="./" style="text-decoration:none;display:inline-block">Prihlásiť sa ako vedúci na úvode</a></div>`;
      return;
    }
    html += `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
        <div class="seg" style="flex:1;min-width:200px"><button class="${env === 'test' ? 'on' : ''}" onclick="setEnv('test')">🧪 Test</button><button class="${env === 'live' ? 'on' : ''}" onclick="setEnv('live')">🟢 Ostré (web)</button></div>
        ${f ? '' : '<button class="btn" onclick="openForm()">➕ Nová</button>'}</div>
      ${env === 'test' ? '<a class="btn ghost sm" href="rezervacia-test.html" style="display:inline-block;text-decoration:none;margin-bottom:8px">🧪 Vyskúšať rezerváciu ako zákazník ›</a>' : ''}
      <p class="empty" style="font-size:12px;margin:0 0 10px">${env === 'test' ? 'Testovacia časť – sem idú rezervácie, kým je plugin na webe v režime „Test“, aj z testovacej stránky.' : 'Ostré rezervácie zákazníkov z webu.'} Čo tu pridáš, upravíš alebo zrušíš, sa hneď ukáže na webe (obsadené / voľné časy).</p>`;
    if (loadErr) html += `<div class="warn">${esc(loadErr)}</div>`;
    if (f) html += formHtml();
    if (!loaded && !loadErr) { app.innerHTML = html + '<p class="empty">Načítavam rezervácie…</p>'; return; }
    const items = list(), tk = todayKey();
    const nNew = items.filter(b => (b.status || 'new') === 'new').length;
    html += `<h2>${showOld ? 'Všetky rezervácie' : 'Nadchádzajúce'} · ${items.length}${nNew ? ` · <span style="color:var(--yellow)">🆕 ${nNew} nových</span>` : ''}</h2>`;
    let lastDay = '';
    items.forEach(b => {
      const d = firstGame(b).date;
      if (d !== lastDay) { lastDay = d; html += `<div class="day">${d === tk ? 'DNES · ' : ''}${esc(dayTitle(d))}</div>`; }
      html += bookingHtml(b);
    });
    if (!items.length) html += `<div class="empty">Žiadne ${showOld ? '' : 'nadchádzajúce '}rezervácie.</div>`;
    html += `<button class="btn ghost sm" style="margin-top:12px" onclick="showOld=!showOld;render()">${showOld ? 'Len nadchádzajúce' : 'Zobraziť aj staré a zrušené'}</button>
      <footer>📆 Rezervácie (rezervacie.html) · verzia 2026-10-25 · beta</footer>`;
    app.innerHTML = html;
  }

  // ---- Firebase ----
  let offFns = [];
  function watch() {
    offFns.forEach(fn => fn()); offFns = [];
    bookings = {}; slots = {}; loaded = false; loadErr = '';
    if (!isMgr) return;
    const db = firebase.database();
    const err = e => { console.error('[rezervácie]', e); loadErr = 'Rezervácie sa nepodarilo načítať. Pravdepodobne ešte nie sú vo Firebase vložené pravidlá pre „laser“ (súbor pravidla-CELE-vlozit.json).'; render(); };
    const bRef = db.ref(`${base()}/bookings`), sRef = db.ref(`${base()}/slots`);
    const bCb = bRef.on('value', s => { bookings = s.val() || {}; loaded = true; render(); }, err);
    const sCb = sRef.on('value', s => { slots = s.val() || {}; render(); }, err);
    offFns.push(() => bRef.off('value', bCb), () => sRef.off('value', sCb));
  }
  try {
    firebase.initializeApp({
      apiKey: "AIzaSyB-2HeoePKrcsdawvI1LCOTQ6vWjibItpU",
      authDomain: "chillpoint-smeny-350c4.firebaseapp.com",
      databaseURL: "https://chillpoint-smeny-350c4-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "chillpoint-smeny-350c4",
      storageBucket: "chillpoint-smeny-350c4.firebasestorage.app",
      messagingSenderId: "251580957782",
      appId: "1:251580957782:web:801f838e4cd65abb4027f7"
    });
    // vedúci je prihlásený z úvodu (Firebase Auth je spoločné pre celú appku); v režime 👁 sa správa ako zamestnanec
    firebase.auth().onAuthStateChanged(u => {
      const mgr = !!u && (u.email || '').toLowerCase() === MANAGER_EMAIL && !ls.get('cp_viewAs');
      authReady = true;
      if (mgr !== isMgr) { isMgr = mgr; watch(); }
      render();
    });
  } catch (e) { $('app').innerHTML = '<p class="empty">Nepodarilo sa pripojiť. Skús obnoviť stránku.</p>'; }
  render();
  window.addEventListener('focusout', () => setTimeout(render, 50));
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
  </script>
</body>
