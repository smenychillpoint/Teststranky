       Rovnaký formulár ako na webe (WordPress plugin chillpoint-rezervacie, assets/rezervacia.css + .js vložené nižšie),
       ale VŽDY ukladá do TESTOVACEJ časti Firebase (laser/test) → rezervácie vidno v rezervacie.html pri „🧪 Test“.
       Pri zmene pluginu treba sem skopírovať novú rezervacia.css a rezervacia.js. */
    html,body{margin:0;background:#0a0c0f;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow-x:clip}
    .tbar{max-width:860px;margin:0 auto;padding:14px 16px 4px;font-size:14px;line-height:1.5}

    .tbar a{color:#f5bb16;font-weight:700}

/* Rezervácia laser game – všetky štýly pod #rz, farby cez premenné (nový dizajn ich len prepíše). */
#rz {
  --rz-bg: #1f1e25;
  --rz-bg-2: #17161b;
  --rz-line: #34323d;
  --rz-ink: #f4f1ea;
  --rz-muted: #a6a3ad;
  --rz-accent: #efc74f;
  --rz-accent-ink: #1a1a1a;
  --rz-free: #2a2931;
  --rz-busy: #e5484d;
  --rz-busy-bg: rgba(229, 72, 77, .14);
  --rz-ok: #46c66d;
  max-width: 860px;
  margin: 0 auto;
  color: var(--rz-ink);
}
#rz *, #rz *::before, #rz *::after { box-sizing: border-box; }
#rz h2 { margin: 0 0 6px; font-size: clamp(1.5rem, 4vw, 2rem); }
#rz h3 { margin: 0 0 10px; font-size: 1.05rem; }
#rz .rz-card { background: var(--rz-bg); border: 1px solid var(--rz-line); border-radius: 14px; padding: 28px; }
#rz .rz-sub { margin: 0 0 22px; color: var(--rz-muted); }
#rz .rz-hint { color: var(--rz-muted); margin: 8px 0; }

/* kroky */
#rz .rz-steps { display: flex; gap: 8px; list-style: none; margin: 0 0 26px; padding: 0; }
#rz .rz-steps li { flex: 1; display: flex; align-items: center; gap: 8px; padding-bottom: 10px; border-bottom: 3px solid var(--rz-line); color: var(--rz-muted); font-size: .92rem; margin: 0; }
#rz .rz-steps em { font-style: normal; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--rz-line); color: var(--rz-ink); font-weight: 700; font-size: .85rem; flex: none; }
#rz .rz-steps li.current, #rz .rz-steps li.done { border-color: var(--rz-accent); }
#rz .rz-steps li.current { color: var(--rz-ink); font-weight: 600; }
#rz .rz-steps li.current em, #rz .rz-steps li.done em { background: var(--rz-accent); color: var(--rz-accent-ink); }

/* tlačidlá */
#rz button { font: inherit; cursor: pointer; }
#rz button:disabled { cursor: not-allowed; }
#rz button:focus-visible, #rz input:focus-visible, #rz a:focus-visible { outline: 3px solid var(--rz-accent); outline-offset: 2px; }
#rz .rz-btn { background: var(--rz-accent); color: var(--rz-accent-ink); border: 2px solid var(--rz-accent); border-radius: 8px; padding: 13px 26px; font-weight: 700; }
#rz .rz-btn:hover:not(:disabled) { filter: brightness(1.08); }
#rz .rz-btn:disabled { opacity: .4; }
#rz .rz-btn.ghost { background: transparent; color: var(--rz-ink); border-color: var(--rz-line); }
#rz .rz-link { background: none; border: 0; padding: 4px; color: var(--rz-muted); text-decoration: underline; font-size: .9rem; }
#rz .rz-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 26px; flex-wrap: wrap; }

/* počet hráčov */
#rz .rz-stepper { display: inline-flex; align-items: center; border: 1px solid var(--rz-line); border-radius: 10px; overflow: hidden; }
#rz .rz-stepper button { width: 60px; height: 60px; border: 0; background: var(--rz-free); color: var(--rz-ink); font-size: 1.7rem; }
#rz .rz-stepper button:disabled { opacity: .3; }
#rz .rz-stepper output { min-width: 80px; text-align: center; font-size: 1.8rem; font-weight: 800; }

/* kalendár: 2 mesiace vedľa seba */
#rz .rz-months { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
#rz .rz-month h3 { text-transform: capitalize; }
#rz .rz-week, #rz .rz-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
#rz .rz-week span { text-align: center; font-size: .78rem; color: var(--rz-muted); padding-bottom: 4px; }
#rz .rz-day { position: relative; aspect-ratio: 1; border: 1px solid var(--rz-line); border-radius: 8px; background: var(--rz-free); color: var(--rz-ink); font-weight: 600; font-size: .95rem; padding: 0; }
#rz .rz-day.empty { border: 0; background: none; }
#rz .rz-day:hover:not(:disabled) { border-color: var(--rz-accent); }
#rz .rz-day.today { box-shadow: inset 0 0 0 1px var(--rz-muted); }
#rz .rz-day.active { background: var(--rz-accent); color: var(--rz-accent-ink); border-color: var(--rz-accent); }
#rz .rz-day.past, #rz .rz-day.closed { background: transparent; color: #5d5a66; border-color: transparent; }
#rz .rz-day.full { background: var(--rz-busy-bg); color: var(--rz-busy); border-color: transparent; text-decoration: line-through; }
#rz .rz-day i { position: absolute; top: 2px; right: 3px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--rz-ok); color: #0d1a10; font: 700 .68rem/16px system-ui, sans-serif; font-style: normal; text-align: center; padding: 0 3px; }
#rz .rz-day.active i { background: var(--rz-accent-ink); color: var(--rz-accent); }

/* časy */
#rz .rz-times { margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--rz-line); scroll-margin-top: 90px; }
#rz .rz-dayname { scroll-margin-top: 90px; }
#rz .rz-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 14px; font-size: .82rem; color: var(--rz-muted); }
#rz .rz-legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
#rz .rz-legend .free::before { background: var(--rz-free); border: 1px solid var(--rz-line); }
#rz .rz-legend .picked::before { background: var(--rz-accent); }
#rz .rz-legend .busy::before { background: var(--rz-busy-bg); border: 1px solid var(--rz-busy); }
#rz .rz-slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
#rz .rz-slot { display: flex; flex-direction: column; align-items: center; justify-content: center; aspect-ratio: 1.25; border: 1px solid var(--rz-line); border-radius: 10px; background: var(--rz-free); color: var(--rz-ink); line-height: 1.2; transition: transform .1s, border-color .1s; }
#rz .rz-slot b { font-size: 1.12rem; }
#rz .rz-slot small { font-size: .72rem; color: var(--rz-muted); }
#rz .rz-slot.free:hover { border-color: var(--rz-accent); transform: translateY(-1px); }
#rz .rz-slot.picked { background: var(--rz-accent); border-color: var(--rz-accent); color: var(--rz-accent-ink); }
#rz .rz-slot.picked small { color: var(--rz-accent-ink); }
#rz .rz-slot.busy, #rz .rz-slot.rest { background: var(--rz-busy-bg); border-color: var(--rz-busy); color: var(--rz-busy); }
#rz .rz-slot.busy small, #rz .rz-slot.rest small { color: var(--rz-busy); }
#rz .rz-slot.busy b { text-decoration: line-through; }

/* vybrané hry */
#rz .rz-picked { margin-top: 24px; padding: 16px 18px; border-radius: 12px; background: var(--rz-bg-2); border: 1px solid var(--rz-line); }
#rz .rz-picked ul { list-style: none; margin: 0; padding: 0; }
#rz .rz-picked li { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-top: 1px solid var(--rz-line); margin: 0; }
#rz .rz-picked li:first-child { border-top: 0; }

/* formulár */
#rz .rz-summary { list-style: none; margin: 14px 0 0; padding: 0; border: 1px solid var(--rz-line); border-radius: 12px; }
#rz .rz-summary li { display: flex; justify-content: space-between; gap: 16px; padding: 11px 16px; border-top: 1px solid var(--rz-line); margin: 0; }
#rz .rz-summary li:first-child { border-top: 0; }
#rz .rz-summary span { color: var(--rz-muted); }
#rz .rz-summary b { text-align: right; }
#rz .rz-form { margin-top: 20px; }
#rz .rz-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
#rz .rz-form label { display: flex; flex-direction: column; gap: 5px; font-weight: 600; font-size: .92rem; margin-bottom: 14px; }
#rz .rz-form input:not([type="checkbox"]) { font: inherit; font-weight: 400; padding: 12px 13px; border: 1px solid var(--rz-line); border-radius: 8px; background: var(--rz-bg-2); color: var(--rz-ink); width: 100%; }
#rz .rz-form label.rz-check { flex-direction: row; align-items: flex-start; gap: 10px; font-weight: 400; }
#rz .rz-check input { width: 20px; height: 20px; margin: 2px 0 0; flex: none; accent-color: var(--rz-accent); }
#rz .rz-check a { color: var(--rz-ink); }

#rz .rz-status { margin: 12px 0 0; }
#rz .rz-status:empty { margin: 0; }
#rz .rz-status.err { color: var(--rz-busy); font-weight: 600; }
#rz .rz-status.warn { padding: 10px 14px; border-radius: 10px; background: var(--rz-busy-bg); color: var(--rz-busy); }
#rz .rz-test { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: rgba(239, 199, 79, .12); border: 1px dashed var(--rz-accent); font-size: .9rem; color: var(--rz-ink); }

/* hotovo */
#rz .rz-done { text-align: center; padding: 16px 0; }
#rz .rz-done-icon { width: 68px; height: 68px; margin: 0 auto 14px; border-radius: 50%; background: var(--rz-accent); color: var(--rz-accent-ink); display: grid; place-items: center; font-size: 2.1rem; font-weight: 800; }
#rz .rz-done ul { list-style: none; padding: 0; margin: 14px 0; font-weight: 700; font-size: 1.1rem; }
#rz .rz-done li { margin: 0 0 4px; }

@media (max-width: 680px) {
  #rz .rz-card { padding: 20px 14px; border-radius: 12px; }
  #rz .rz-months { grid-template-columns: 1fr; gap: 22px; }
  #rz .rz-steps span { display: none; }
  #rz .rz-steps li.current span { display: inline; }
  #rz .rz-row { grid-template-columns: 1fr; gap: 0; }
  #rz .rz-slots { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  #rz .rz-slot b { font-size: 1rem; }
  #rz .rz-nav .rz-btn { flex: 1; }
}

/* ---- WordPress: téma (napr. Astra) štýluje všetky tlačidlá a polia – tu ich vrátime do pôvodného stavu ---- */
#rz button, #rz input { text-transform: none; letter-spacing: normal; box-shadow: none; line-height: 1.2; min-height: 0; }
#rz p { margin-top: 0; }
#rz ul { margin-left: 0; }

/* ---- Svetlý vzhľad (Nastavenia → Chillpoint rezervácie → Vzhľad) ---- */
#rz.rz-light {
  --rz-bg: #ffffff;
  --rz-bg-2: #f6f6f8;
  --rz-line: #e2e2e8;
  --rz-ink: #1b1b1b;
  --rz-muted: #6b6b78;
  --rz-free: #f3f3f6;
  --rz-busy: #d33a3f;
  --rz-busy-bg: #fdecec;
  --rz-ok: #1f8a4c;
}
#rz.rz-light .rz-card { box-shadow: 0 10px 40px rgba(0, 0, 0, .07); }
#rz.rz-light .rz-day.past, #rz.rz-light .rz-day.closed { color: #b9b9c3; }
#rz.rz-light .rz-day i { color: #fff; }
#rz.rz-light .rz-test { color: var(--rz-ink); }

/* ---- Bez nastaveného Firebase ---- */
.cpr-off { max-width: 760px; margin: 0 auto; padding: 18px 20px; border-radius: 12px; border: 1px dashed #efc74f; background: rgba(239, 199, 79, .1); }
.cpr-off p { margin: 0; }
/* ---- Ponuka 3+1 ---- */
#rz .rz-offer { margin: 12px 0 0; padding: 10px 14px; border-radius: 10px; background: rgba(239, 199, 79, .14); border-left: 4px solid var(--rz-accent); color: var(--rz-ink); font-weight: 600; }
#rz .rz-free { font-style: normal; font-size: .78rem; font-weight: 700; padding: 2px 8px; margin-left: 6px; border-radius: 20px; background: var(--rz-accent); color: var(--rz-accent-ink); }
#rz .rz-modal { position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center; padding: 16px; background: rgba(0, 0, 0, .6); }
#rz .rz-modal-box { width: 100%; max-width: 440px; background: var(--rz-bg); color: var(--rz-ink); border: 1px solid var(--rz-accent); border-radius: 16px; padding: 26px 22px 20px; text-align: center; box-shadow: 0 20px 60px rgba(0, 0, 0, .4); }
#rz .rz-modal-icon { font-size: 2.6rem; line-height: 1; margin-bottom: 8px; }
#rz .rz-modal-box h3 { font-size: 1.35rem; margin: 0 0 8px; }
#rz .rz-modal-box p { color: var(--rz-muted); margin: 0; }
#rz .rz-modal-box p b { color: var(--rz-ink); }
#rz .rz-modal-box .rz-nav { margin-top: 20px; justify-content: center; }
/* ---- 1.5.0: Čo si rezervujete (laser game / balíček), poradie v balíčku ---- */
#rz .rz-opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 16px; }
#rz .rz-opt { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; padding: 16px 18px; border: 2px solid var(--rz-line); border-radius: 12px; background: var(--rz-free); color: var(--rz-ink); line-height: 1.35; }
#rz .rz-opt b { font-size: 1.15rem; }
#rz .rz-opt small { color: var(--rz-muted); font-size: .88rem; }
#rz .rz-opt span { font-size: .93rem; }
#rz .rz-opt:hover { border-color: var(--rz-accent); }
#rz .rz-opt.on { border-color: var(--rz-accent); background: rgba(239, 199, 79, .12); }
#rz .rz-seg { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 20px; }
#rz .rz-seg button { flex: 1 1 200px; padding: 11px 14px; border: 1px solid var(--rz-line); border-radius: 8px; background: var(--rz-free); color: var(--rz-ink); font-weight: 600; }
#rz .rz-seg button.on { background: var(--rz-accent); border-color: var(--rz-accent); color: var(--rz-accent-ink); }
#rz .rz-picked li b { text-align: right; }
  </style>
</head>
<body>
  <div class="tbar"><div class="box">🧪 <b>TESTOVACIA rezervácia</b> – ukladá sa len do testovacej časti, zákazníci ju nevidia. Vzhľad: <a href="?">tmavý</a> · <a href="?light">svetlý</a></div></div>

  <script>
    if (location.search.includes('light')) { document.getElementById('rz').className = 'rz-light'; document.body.style.background = '#fff'; document.body.style.color = '#111'; }
    window.CP_CONFIG = {

      firebase: {

        storageBucket: "chillpoint-smeny-350c4.firebasestorage.app",
        messagingSenderId: "251580957782",
        appId: "1:251580957782:web:801f838e4cd65abb4027f7"

  <script>/* Rezervácia laser game (plugin 1.5.0).
   Kroky: [Čo si rezervujete – len keď sú zapnuté balíčky na webe] → počet hráčov a termín (poradie nastaví vedúci
   v internej appke) → kontaktné údaje → potvrdenie.
   - Po výbere času sa tej istej partii zablokujú časy počas oddychu (rest), iným partiám ostávajú voľné.
   - Obsadené časy (od iných) sú červené a nedajú sa kliknúť.
   - Balíček (Monster Chill a pod.): zákazník vyberie len začiatok, hry rozpíšeme sami (každá o rest min).
   - Úložisko: Firebase (laser/<env>/…), alebo testovací režim v tomto prehliadači.
   Od 1.5.0 sa web riadi nastaveniami z appky (laser/<env>/config + settings/rezPackages) – pri zmene netreba plugin nahrávať znova. */
(function () {
  "use strict";

  const root = document.getElementById("rz");
  if (!root) return;

  const CFG = window.CP_CONFIG || {};
  const B = Object.assign({
    hours: {}, daysOff: [], step: 20, game: 15, change: 5, rest: 40,
    minPlayers: 2, maxPlayers: 16, maxGames: 8, leadMinutes: 15,
    offers: [{ minPlayers: 8, paid: 3, free: 1 }],   // ponuky (3+1 a ďalšie); prázdne = žiadna
    offerStep: "off",                                 // výber ponuky zákazníkom: "off" | "before" / "after" (pred / po počte hráčov)
    stepOrder: "players",                             // poradie krokov: "players" (najprv počet hráčov) | "term" (najprv termín)
    webPkgs: {},                                      // balíčky, ktoré sa dajú rezervovať na webe: { monster: true }
    phone: "", privacyUrl: "#", emailToCustomer: false
  }, CFG.booking || {});
  let BLOCK = B.game + B.change;            // na koľko minút hra zablokuje arénu pre iné partie

  /* Nastavenia, ktoré vedúci mení v internej appke (laser/<env>/config vo Firebase), prepíšu tie z WordPressu.
     „offers“ = zoznam ponúk (od 2026-10-27); staršie „offer“ (jedna ponuka) sa ešte číta, ak „offers“ chýba.
     „stepOrder“ a „webPkgs“ od 1.5.0 (2026-10-30). */
  const REMOTE_KEYS = ["hours", "daysOff", "step", "game", "change", "rest", "minPlayers", "maxPlayers", "maxGames", "leadMinutes", "offer", "offers", "offerStep", "stepOrder", "webPkgs", "mailCustomer"];
  function applyRemoteConfig(c) {
    if (!c || typeof c !== "object") return;
    REMOTE_KEYS.forEach(k => { if (c[k] !== undefined && c[k] !== null) B[k] = c[k]; });
    if (c.offers === undefined || c.offers === null) { if (c.offer !== undefined && c.offer !== null) B.offers = c.offer ? [c.offer] : []; }
    if (!Array.isArray(B.daysOff)) B.daysOff = Object.values(B.daysOff || {});
    if (!B.webPkgs || typeof B.webPkgs !== "object") B.webPkgs = {};   // "" = žiadny balíček
    BLOCK = B.game + B.change;
  }

  /* ============ POMOCNÉ ============ */
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); };
  const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
  const toTime = m => pad(Math.floor(m / 60)) + ":" + pad(m % 60);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const MONTHS = ["január", "február", "marec", "apríl", "máj", "jún", "júl", "august", "september", "október", "november", "december"];
  const DAY_SHORT = ["Ne", "Po", "Ut", "St", "Št", "Pi", "So"];
  const dayLabel = s => { const d = parseYmd(s); return DAY_SHORT[d.getDay()] + " " + d.getDate() + ". " + (d.getMonth() + 1) + "."; };
  const itemLabel = it => dayLabel(it.date) + " o " + it.time;
  const games = n => n + (n === 1 ? " hra" : n < 5 ? " hry" : " hier");
  const players = n => n + (n < 5 ? " hráči" : " hráčov");
  const people = n => n + (n === 1 ? " osoba" : n < 5 ? " osoby" : " osôb");
  /* laser/<env>/pk/<deň>/<OD>_<DO> = kedy má balíček atrakcie (HHMM, po polnoci 24xx); bez atrakcií OD = DO = začiatok */
  const hm = m => toTime(m).replace(":", "");
  const pkWin = k => { const m = /^(\d\d)(\d\d)_(\d\d)(\d\d)$/.exec(k); return m ? { from: +m[1] * 60 + +m[2], to: +m[3] * 60 + +m[4] } : null; };

  /* ============ ÚLOŽISKO ============ */
  /* watch(from, to, cb) → cb({ "2026-10-24": Set{"18:00", …} }) pri každej zmene; vracia funkciu na zrušenie.
     watchPk(from, to, cb) → to isté pre začiatky balíčkov (laser/<env>/pk).
     book(items, data, pk) → uloží rezerváciu (pk = {date, time} začiatok balíčka); ak je niektorý čas medzitým obsadený,
     hodí chybu s code "taken". */

  function localStore() {
    const KEY = "cp_laser_test";
    const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || { slots: {}, bookings: {} }; } catch (e) { return { slots: {}, bookings: {} }; } };
    const listeners = new Set();
    const notify = () => listeners.forEach(fn => fn());
    window.addEventListener("storage", e => { if (e.key === KEY) notify(); });
    const sets = (all, from, to) => {
      const out = {};
      Object.keys(all || {}).filter(d => d >= from && d <= to).forEach(d => { out[d] = new Set(Object.keys(all[d]).map(k => k.slice(0, 2) + ":" + k.slice(2))); });
      return out;
    };
    const wins = (all, from, to) => {
      const out = {};
      Object.keys(all || {}).filter(d => d >= from && d <= to).forEach(d => { out[d] = Object.keys(all[d]).map(pkWin).filter(Boolean); });
      return out;
    };
    return {
      mode: "test",
      watch(from, to, cb) {
        const run = () => cb(sets(read().slots, from, to));
        listeners.add(run); run();
        return () => listeners.delete(run);
      },
      watchPk(from, to, cb) {
        const run = () => cb(wins(read().pk, from, to));
        listeners.add(run); run();
        return () => listeners.delete(run);
      },
      async book(items, data, pk) {
        const db = read();
        if (items.some(it => db.slots[it.date] && db.slots[it.date][it.time.replace(":", "")])) {
          const err = new Error("taken"); err.code = "taken"; throw err;
        }
        const id = "t" + Date.now().toString(36);
        db.bookings[id] = Object.assign({}, data, { createdAt: Date.now() });
        items.forEach(it => { (db.slots[it.date] = db.slots[it.date] || {})[it.time.replace(":", "")] = id; });
        if (pk) { db.pk = db.pk || {}; (db.pk[pk.date] = db.pk[pk.date] || {})[pk.key] = id; }
        localStorage.setItem(KEY, JSON.stringify(db));
        notify();
        return id;
      },
      reset() { localStorage.removeItem(KEY); notify(); }
    };
  }

  async function firebaseStore(cfg, env) {
    const base = "https://www.gstatic.com/firebasejs/10.12.2/";
    const [{ initializeApp }, fb] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-database.js")]);
    const db = fb.getDatabase(initializeApp(cfg, "cp-rezervacie"));
    const path = "laser/" + env;
    const sets = snap => {
      const out = {};
      snap.forEach(d => { out[d.key] = new Set(Object.keys(d.val() || {}).map(k => k.slice(0, 2) + ":" + k.slice(2))); });
      return out;
    };
    return {
      mode: "firebase",
      async config() {
        try { return (await fb.get(fb.ref(db, path + "/config"))).val(); }
        catch (e) { console.warn("[rezervácia] nastavenia z Firebase", e); return null; }
      },
      /* balíčky (Monster Chill a pod.) upravuje vedúci v appke – sú verejne čitateľné */
      async packages() {
        try { return (await fb.get(fb.ref(db, "settings/rezPackages"))).val(); }
        catch (e) { console.warn("[rezervácia] balíčky z Firebase", e); return null; }
      },
      watch(from, to, cb, onError) {
        const q = fb.query(fb.ref(db, path + "/slots"), fb.orderByKey(), fb.startAt(from), fb.endAt(to));
        return fb.onValue(q, snap => cb(sets(snap)), onError);
      },
      watchPk(from, to, cb) {
        const q = fb.query(fb.ref(db, path + "/pk"), fb.orderByKey(), fb.startAt(from), fb.endAt(to));
        return fb.onValue(q, snap => {
          const out = {};
          snap.forEach(d => { out[d.key] = Object.keys(d.val() || {}).map(pkWin).filter(Boolean); });
          cb(out);
        }, e => { console.warn("[rezervácia] atrakcie balíčkov", e); cb({}); });
      },
      /* Rezervácia aj obsadenie časov v jednom zápise: buď prejde celé, alebo nič.
         Pravidlá Firebase nedovolia zapísať čas, ktorý už niekto má.
         Telefón a e-mail idú do samostatnej časti contacts, ktorú číta len vedúci a bar (nie zdieľané zariadenie). */
      async book(items, data, pk) {
        const id = fb.push(fb.ref(db, path + "/bookings")).key;
        const u = {}, rest = Object.assign({}, data);
        delete rest.phone; delete rest.email;
        u[path + "/bookings/" + id] = Object.assign(rest, { createdAt: fb.serverTimestamp(), status: "new" });
        u[path + "/contacts/" + id] = { phone: data.phone, email: data.email };
        items.forEach(it => { u[path + "/slots/" + it.date + "/" + it.time.replace(":", "")] = id; });
        if (pk) u[path + "/pk/" + pk.date + "/" + pk.key] = id;
        try { await fb.update(fb.ref(db), u); }
        catch (e) {
          if (String(e.code || e.message).toUpperCase().includes("PERMISSION")) { const err = new Error("taken"); err.code = "taken"; throw err; }
          throw e;
        }
        return id;
      }
    };
  }

  /* ============ STAV ============ */
  const state = {
    step: "players",             // "what" | "players" | "term" | "form" | "done"
    moved: false,                // zákazník už prešiel na iný krok (po načítaní nastavení ho nevraciame)
    what: null,                  // "laser" | id balíčka (null = ešte nevybral)
    players: B.minPlayers,
    day: null,                   // vybraný deň "2026-10-24"
    busy: {},                    // obsadené časy od iných: { date: Set }
    pk: {},                      // začiatky iných balíčkov: { date: Set }
    loaded: false,
    selected: new Map(),         // "2026-10-24 18:00" -> { date, time }
    mStart: null,                // balíček: vybraný začiatok "16:00"
    mDay: null,                  // balíček: deň začiatku
    mOrder: "games",             // balíček: "games" (najprv laser game) | "attr" (najprv atrakcie)
    notice: "",
    error: "",
    sending: false,
    done: null,
    offerPick: null,             // výber ponuky zákazníkom (ak je zapnutý): "none" | "3+1"…
    offerModal: null,            // deň, pre ktorý ukazujeme okno „vyberte si 4. hru zadarmo“
    offerShown: new Set()        // dni, pre ktoré sme okno už ukázali (neotravovať opakovane)
  };
  let store = null, unwatch = null, unwatchPk = null, focusKey = null;

  /* ============ ČASY A DNI ============ */
  const now = () => new Date();
  const earliest = () => { const d = new Date(Date.now() + B.leadMinutes * 60000); return ymd(d) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); };

  function hoursFor(date) {
    if ((B.daysOff || []).includes(date)) return null;
    const h = B.hours[parseYmd(date).getDay()];
    return h && h[0] && h[1] ? [toMin(h[0]), toMin(h[1]) || 1440] : null;
  }

  /* Všetky začiatky hier v daný deň (bez tých, čo už prešli). */
  function timesFor(date) {
    const h = hoursFor(date);
    if (!h) return [];
    const out = [], min = earliest();
    for (let m = h[0]; m + B.game <= h[1]; m += B.step) {
      const t = toTime(m);
      if (date + " " + t >= min) out.push(t);
    }
    return out;
  }

  /* Čas je obsadený inou partiou, ak sa jej hra (s výmenou) prekrýva s touto. */
  function takenByOthers(date, time) {
    const set = state.busy[date];
    if (!set || !set.size) return false;
    const t = toMin(time);
    for (const s of set) if (Math.abs(toMin(s) - t) < BLOCK) return true;
    return false;
  }

  /* Tá istá partia potrebuje oddych: časy bližšie ako `rest` k vybranému sú pre ňu zablokované. */
  function restConflict(date, time) {
    const t = toMin(time);
    for (const it of state.selected.values())
      if (it.date === date && it.time !== time && Math.abs(toMin(it.time) - t) < B.rest) return it;
    return null;
  }

  function statusOf(date, time) {
    if (state.selected.has(date + " " + time)) return "picked";
    if (takenByOthers(date, time)) return "busy";
    if (restConflict(date, time)) return "rest";
    return "free";
  }

  const freeCount = date => {
    const P = curPkg();
    return P ? timesFor(date).filter(t => pkgStartOk(date, t, P, state.mOrder)).length : timesFor(date).filter(t => !takenByOthers(date, t)).length;
  };
  const sortedItems = () => [...state.selected.values()].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

  /* ============ BALÍČKY (Monster Chill a pod.) ============ */
  /* Balíčky upravuje vedúci v appke (settings/rezPackages), ktoré idú na web, zaškrtne v nastaveniach webu (webPkgs).
     Balíček = P.games hier laser game (každá o B.rest min) a P.attrMin min atrakcií (P.attrText), pred alebo po hrách.
     Ďalší balíček môže začať najskôr o P.spacing min (kvôli atrakciám) – preto web číta začiatky balíčkov z laser/<env>/pk. */
  const PKG_DEF = { monster: { name: "Monster Chill", games: 3, attrMin: 60, attrText: "VR + PS", pizzaMin: 30, spacing: 60, players: 10, webMin: 8, webMax: 12, webText: "Oslava pre deti aj dospelých: 3 hry laser game a potom VR a PlayStation." } };
  const PKG_NUM = { games: [1, 12, 3], attrMin: [0, 600, 60], pizzaMin: [0, 240, 30], spacing: [0, 600, 60], players: [1, 30, 10], webMin: [0, 30, 0], webMax: [0, 30, 0] };
  let pkgRaw = null;
  function pkgNorm(p) {
    const o = { name: String((p && p.name) || "Balíček").slice(0, 40), attrText: String((p && p.attrText != null ? p.attrText : "VR + PS")).slice(0, 40), webText: String((p && p.webText) || "").slice(0, 200),
      icon: Array.from(String((p && p.icon) || "").replace(/[<>"'&`\\]/g, "").trim()).slice(0, 6).join("") || "🎁" };   // ikonku mení vedúci v appke
    Object.keys(PKG_NUM).forEach(k => { const [lo, hi, d] = PKG_NUM[k], v = parseInt(p && p[k], 10); o[k] = Number.isFinite(v) ? Math.max(lo, Math.min(hi, v)) : d; });
    return o;
  }
  function pkgs() {
    const src = pkgRaw && typeof pkgRaw === "object" && Object.keys(pkgRaw).length ? pkgRaw : PKG_DEF, out = {};
    Object.keys(src).forEach(id => { if (src[id] && /^[a-z0-9-]{1,30}$/.test(id)) out[id] = pkgNorm(src[id]); });
    return out;
  }
  const webPkgs = () => { const all = pkgs(), w = B.webPkgs || {}; return Object.keys(all).filter(id => w[id] === true).map(id => Object.assign({ id }, all[id])); };
  const curPkg = () => (state.what && state.what !== "laser" ? webPkgs().find(p => p.id === state.what) || null : null);
  const minPl = () => { const P = curPkg(); return Math.max(1, (P && P.webMin) || B.minPlayers); };
  const maxPl = () => { const P = curPkg(); return Math.min(30, Math.max(minPl(), (P && P.webMax) || B.maxPlayers)); };
  const clampPl = n => Math.min(maxPl(), Math.max(minPl(), n));
  const pkgGames = (start, order, P) => Array.from({ length: P.games }, (_, i) => toTime(toMin(start) + (order === "attr" ? P.attrMin : 0) + i * B.rest));
  /* kedy budú atrakcie (orientačne, v minútach od polnoci) */
  function pkgAttr(start, order, P) {
    if (order === "attr") return [toMin(start), toMin(start) + P.attrMin];
    const g = pkgGames(start, order, P), from = toMin(g[g.length - 1]) + B.game + P.pizzaMin;
    return [from, from + P.attrMin];
  }
  const pkgText = P => games(P.games) + " laser game" + (P.attrMin ? " + " + P.attrText + " " + P.attrMin + " min" : "");
  const maxSpacing = P => Math.max(P.spacing, ...Object.values(pkgs()).map(p => p.spacing));
  /* kedy má balíček atrakcie [od, do] v minútach; bez atrakcií [začiatok, začiatok] */
  const pkgWin = (start, order, P) => (P.attrMin ? pkgAttr(start, order, P) : [toMin(start), toMin(start)]);
  /* Začiatok balíčka je voľný: všetky jeho hry sú v otváracích hodinách a voľné, celý balíček stihne do zatvorenia
     a iný balíček nemá atrakcie v rovnakom čase (VR + PS majú naraz len jedni); balíčky bez atrakcií držia rozostup. */
  function pkgStartOk(date, start, P, order) {
    const h = hoursFor(date);
    if (!h || date + " " + start < earliest() || toMin(start) < h[0]) return false;
    for (const t of pkgGames(start, order, P)) {
      const m = toMin(t);
      if (m < h[0] || m + B.game > h[1] || takenByOthers(date, t)) return false;
    }
    const w = pkgWin(start, order, P);
    if (P.attrMin && w[1] > h[1]) return false;
    for (const o of state.pk[date] || []) {
      if (w[1] > w[0] && o.to > o.from) { if (w[0] < o.to && o.from < w[1]) return false; }
      else if (w[1] === w[0] && o.to === o.from && Math.abs(o.from - w[0]) < maxSpacing(P)) return false;
    }
    return true;
  }
  function pickStart(date, start) {
    const P = curPkg();
    state.selected.clear();
    state.mStart = start; state.mDay = date;
    if (P && start) pkgGames(start, state.mOrder, P).forEach(t => state.selected.set(date + " " + t, { date, time: t }));
  }
  function clearStart() { state.selected.clear(); state.mStart = null; state.mDay = null; }

  /* ============ PONUKY (3+1 a ďalšie) – len pri samotnom laser game ============ */
  /* Ponuka = {minPlayers, paid, free}: partia aspoň minPlayers hráčov, ktorá si v jeden deň vyberie paid hier,
     dostane ďalších free hier zadarmo (v každom bloku paid+free). Platí najvýhodnejšia ponuka pre počet hráčov. */
  function offersList() {
    const raw = B.offers === "" || B.offers === false ? [] : (Array.isArray(B.offers) ? B.offers : (B.offers && typeof B.offers === "object" ? Object.values(B.offers) : []));
    return raw.filter(o => o && +o.minPlayers >= 1 && +o.paid >= 1)
      .map(o => ({ minPlayers: +o.minPlayers, paid: +o.paid, free: Math.max(1, +o.free || 1) }))
      .sort((a, b) => a.minPlayers - b.minPlayers || a.paid - b.paid);
  }
  const offerOn = () => !curPkg() && offersList().length > 0;
  const bundleOf = o => o.paid + o.free;
  const rate = o => o.free / bundleOf(o);
  /* ponuka, ktorú partia s n hráčmi má (najvýhodnejšia z tých, na ktoré má dosť ľudí) */
  const bestFor = n => offersList().filter(o => n >= o.minPlayers).sort((a, b) => rate(b) - rate(a) || a.paid - b.paid)[0] || null;
  const offerName = o => o.paid + "+" + o.free;
  /* Výber ponuky zákazníkom (zapína vedúci v appke): state.offerPick = null (ešte nevybral) | "none" | "3+1"… */
  const offerStepOn = () => offerOn() && (B.offerStep === "before" || B.offerStep === "after");
  const pickedOffer = () => offersList().find(o => offerName(o) === state.offerPick) || null;
  const cur = () => {
    if (!offerOn()) return null;
    if (!offerStepOn()) return bestFor(state.players);
    const p = pickedOffer();
    return p && state.players >= p.minPlayers ? p : null;
  };
  /* najbližšia ponuka, na ktorú partii chýbajú ľudia (a ktorá by bola výhodnejšia ako tá, čo majú) */
  const nextOffer = () => {
    if (!offerOn()) return null;
    if (offerStepOn()) { const p = pickedOffer(); return p && state.players < p.minPlayers ? p : null; }
    const c = cur(); return offersList().filter(o => o.minPlayers > state.players && (!c || rate(o) > rate(c))).sort((a, b) => a.minPlayers - b.minPlayers)[0] || null;
  };
  const offerText = o => `${o.paid} ${o.paid === 1 ? "hra" : o.paid < 5 ? "hry" : "hier"} + ${o.free} zadarmo, od ${o.minPlayers} hráčov`;
  const freeWord = o => o.free === 1 ? `${bundleOf(o)}. hru` : `${games(o.free)}`;
  function gamesPerDay() {
    const m = {};
    for (const it of state.selected.values()) m[it.date] = (m[it.date] || 0) + 1;
    return m;
  }
  /* Ktoré vybrané hry sú zadarmo: v každom dni v každom bloku (paid + free) posledných free hier. */
  function freeKeys() {
    const out = new Set(), o = cur();
    if (!o) return out;
    const byDay = {};
    sortedItems().forEach(it => { (byDay[it.date] = byDay[it.date] || []).push(it); });
    Object.values(byDay).forEach(list => list.forEach((it, i) => { if (i % bundleOf(o) >= o.paid) out.add(it.date + " " + it.time); }));
    return out;
  }
  const friends = n => n + (n === 1 ? " kamaráta" : " kamarátov");

  function offerHints() {
    if (!offerOn()) return "";
    const counts = gamesPerDay(), days = Object.keys(counts).sort(), out = [], o = cur(), n = nextOffer();
    if (o) {
      days.forEach(d => {
        const full = Math.floor(counts[d] / bundleOf(o)) * o.free + Math.max(0, counts[d] % bundleOf(o) - o.paid);
        const left = counts[d] % bundleOf(o) >= o.paid ? bundleOf(o) - counts[d] % bundleOf(o) : 0;
        if (full) out.push(`🎁 ${dayLabel(d)}: ${games(full)} od nás zadarmo (ponuka ${offerName(o)}).`);
        if (left) out.push(`🎁 ${dayLabel(d)}: vyberte si ešte ${games(left)}, ${left === 1 ? "máte ju" : "máte ich"} od nás zadarmo (ponuka ${offerName(o)}).`);
      });
    }
    if (n && days.some(d => counts[d] >= n.paid)) {
      out.push(`🎁 Zavolajte ešte ${friends(n.minPlayers - state.players)} (spolu aspoň ${n.minPlayers} hráčov) a pri ${games(n.paid)} máte ${freeWord(n)} zadarmo (ponuka ${offerName(n)}).`);
    }
    return out.map(t => `<p class="rz-offer">${t}</p>`).join("");
  }

  /* Deň, kde má partia presne toľko hier, že by ďalšie boli zadarmo (napr. 3 pri 3+1). */
  function offerDay(o) {
    if (!o) return null;
    const counts = gamesPerDay();
    return Object.keys(counts).sort().find(d => counts[d] % bundleOf(o) === o.paid) || null;
  }

  /* Okno s ponukou: "pick" = po výbere platených hier, "continue" = pri Pokračovať, "friends" = málo hráčov. */
  function offerModal() {
    const m = state.offerModal;
    if (!m || !m.o) return "";
    const o = m.o, friendsCase = m.kind === "friends";
    const miss = o.minPlayers - state.players;
    const text = friendsCase
      ? `Na ${dayLabel(m.date)} máte vybrané ${games(o.paid)}. Zavolajte ešte <b>${friends(miss)}</b> (spolu aspoň ${o.minPlayers} hráčov) a ${freeWord(o)} máte od nás <b>zadarmo</b> (ponuka ${offerName(o)}).`
      : `Ste partia aspoň ${o.minPlayers} hráčov a na ${dayLabel(m.date)} máte vybrané ${games(o.paid)}. Vyberte si ešte ${o.free === 1 ? "jednu hru, tú" : games(o.free) + ", tie"} máte od nás <b>zadarmo</b> (ponuka ${offerName(o)}).`;
    const noLabel = m.kind === "pick" ? "Nie, ďakujem" : "Pokračovať bez ponuky";
    const yes = friendsCase
      ? `<button type="button" class="rz-btn" data-act="offer-players">Zmeniť počet hráčov</button>`
      : `<button type="button" class="rz-btn" data-act="offer-yes">Vybrať ${o.free === 1 ? bundleOf(o) + ". hru" : "hry zadarmo"}</button>`;
    return `
      <div class="rz-modal" role="dialog" aria-modal="true" aria-labelledby="rz-offer-title">
        <div class="rz-modal-box">
          <div class="rz-modal-icon" aria-hidden="true">🎁</div>
          <h3 id="rz-offer-title">${friendsCase ? `${o.free === 1 ? bundleOf(o) + ". hra môže byť" : games(o.free) + " môžu byť"} zadarmo!` : `Máte ${freeWord(o)} zadarmo!`}</h3>
          <p>${text}</p>
          <div class="rz-nav"><button type="button" class="rz-btn ghost" data-act="offer-no">${noLabel}</button>${yes}</div>
        </div>
      </div>`;
  }

  /* Zobrazujeme aktuálny a nasledujúci mesiac. */
  function monthsShown() {
    const d = now(), a = new Date(d.getFullYear(), d.getMonth(), 1), b = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    return [a, b];
  }
  function range() {
    const [, b] = monthsShown();
    const last = new Date(b.getFullYear(), b.getMonth() + 1, 0);
    return [ymd(now()), ymd(last)];
  }

  /* ============ KROKY ============ */
  const STEP_LABEL = { what: "Čo si rezervujete", players: "Počet hráčov", term: "Termín", form: "Vaše údaje" };
  function steps() {
    return (webPkgs().length ? ["what"] : [])
      .concat(B.stepOrder === "term" ? ["term", "players"] : ["players", "term"], ["form"]);
  }
  const nextStep = () => { const s = steps(); return s[s.indexOf(state.step) + 1] || "form"; };
  const prevStep = () => { const s = steps(); return s[Math.max(0, s.indexOf(state.step) - 1)]; };

  /* ============ NAČÍTANIE ============ */
  async function init() {
    render();
    if (CFG.useFirebase && CFG.firebase && CFG.firebase.apiKey) {
      try { store = await firebaseStore(CFG.firebase, CFG.env || "test"); }
      catch (e) { console.error("[rezervácia]", e); }
    }
    if (!store) store = localStore();
    const [c, p] = await Promise.all([store.config ? store.config() : null, store.packages ? store.packages() : null]);
    applyRemoteConfig(c);
    pkgRaw = p;
    if (!webPkgs().length) state.what = "laser";
    if (!state.moved) state.step = steps()[0];
    state.players = clampPl(state.players);
    render();
    const [from, to] = range();
    unwatch = store.watch(from, to, busy => {
      state.busy = busy;
      state.loaded = true;
      dropTaken();
      if (state.step !== "form" && state.step !== "done") render();
    }, err => {
      console.error("[rezervácia]", err);
      state.error = "Voľné časy sa nepodarilo načítať. Skúste obnoviť stránku alebo nám zavolajte na " + B.phone + ".";
      render();
    });
    if (store.watchPk) unwatchPk = store.watchPk(from, to, pk => {
      state.pk = pk;
      dropTaken();
      if (state.step !== "form" && state.step !== "done") render();
    });
  }

  /* Ak si vybraný čas medzitým rezervoval niekto iný, odoberieme ho (balíček celý). */
  function dropTaken() {
    if (state.sending) return;   // vlastná práve odoslaná rezervácia už je v obsadených
    const P = curPkg();
    if (P) {
      if (state.mStart && !pkgStartOk(state.mDay, state.mStart, P, state.mOrder)) {
        state.notice = "Začiatok " + dayLabel(state.mDay) + " o " + state.mStart + " si medzitým rezervoval niekto iný, vyberte prosím iný.";
        clearStart();
      }
      return;
    }
    const lost = [];
    for (const [key, it] of state.selected) if (takenByOthers(it.date, it.time)) { state.selected.delete(key); lost.push(it); }
    if (lost.length) state.notice = "Čas " + lost.map(itemLabel).join(", ") + " si medzitým rezervoval niekto iný, odobrali sme ho z výberu.";
  }

  /* ============ VYKRESLENIE ============ */
  function stepsBar() {
    const s = steps(), cur = s.indexOf(state.step);
    return '<ol class="rz-steps">' + s.map((n, i) => {
      const cls = i < cur ? "done" : i === cur ? "current" : "";
      return `<li class="${cls}"${i === cur ? ' aria-current="step"' : ""}><em>${i + 1}</em><span>${STEP_LABEL[n]}</span></li>`;
    }).join("") + "</ol>";
  }
  const noticeHtml = () => (state.notice ? `<p class="rz-status warn" role="status">${esc(state.notice)}</p>` : "");
  const navHtml = (nextLabel, nextDisabled) => {
    const first = steps().indexOf(state.step) === 0;
    return `<div class="rz-nav">${first ? "<span></span>" : '<button type="button" class="rz-btn ghost" data-act="back">Späť</button>'}<button type="button" class="rz-btn" data-act="next"${nextDisabled ? " disabled" : ""}>${nextLabel || "Pokračovať"}</button></div>`;
  };

  /* 1. krok, keď sú na webe balíčky: laser game alebo balíček */
  function viewWhat() {
    const opt = (val, title, sub, text) => `<button type="button" class="rz-opt${state.what === val ? " on" : ""}" data-act="what" data-what="${esc(val)}" aria-pressed="${state.what === val}"><b>${title}</b><small>${sub}</small>${text ? `<span>${text}</span>` : ""}</button>`;
    return `
      <h2>Čo si rezervujete?</h2>
      <div class="rz-opts">
        ${opt("laser", "🔫 Laser game", `${B.minPlayers}–${B.maxPlayers} hráčov, hra ${B.game} min`, "Počet hier a časy si vyberiete sami.")}
        ${webPkgs().map(P => opt(P.id, esc(P.icon) + " " + esc(P.name), esc(pkgText(P) + ", " + (P.webMin || B.minPlayers) + "–" + Math.max(P.webMin || B.minPlayers, P.webMax || B.maxPlayers) + " ľudí"), esc(P.webText))).join("")}
      </div>
      ${noticeHtml()}
      ${navHtml("Pokračovať", !state.what)}`;
  }

  /* Výber ponuky (pred alebo po počte hráčov – podľa nastavenia v appke). */
  function viewOfferPick() {
    if (!offerStepOn()) return "";
    const p = pickedOffer();
    const opt = (val, title, sub) => `<button type="button" class="rz-slot ${state.offerPick === val ? "picked" : "free"}" data-act="pick" data-pick="${esc(val)}" aria-pressed="${state.offerPick === val}" style="text-align:left;padding:12px 14px"><b>${esc(title)}</b><small>${esc(sub)}</small></button>`;
    return `
      <h2>Akú ponuku si vyberiete?</h2>
      <div class="rz-slots" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">
        ${offersList().map(o => opt(offerName(o), "🎁 Ponuka " + offerName(o), offerText(o))).join("")}
        ${opt("none", "🔫 Len laser game", "bez ponuky")}
      </div>
      ${p && state.players < p.minPlayers ? `<p class="rz-offer">Ponuka ${offerName(p)} platí od ${p.minPlayers} hráčov – zatiaľ máte ${state.players}.</p>` : ""}`;
  }
  function viewPlayers() {
    const P = curPkg();
    const stepper = `
      <h2>Koľko vás bude?</h2>
      <p class="rz-sub">${P ? `Počet ľudí na balíček ${esc(P.name)}` : "Počet hráčov vrátane vás"} (${minPl()}–${maxPl()}).</p>
      <div class="rz-stepper">
        <button type="button" data-act="minus" aria-label="Menej"${state.players <= minPl() ? " disabled" : ""}>−</button>
        <output aria-live="polite">${state.players}</output>
        <button type="button" data-act="plus" aria-label="Viac"${state.players >= maxPl() ? " disabled" : ""}>+</button>
      </div>`;
    const after = steps().indexOf("players") > steps().indexOf("term");   // termín už vybrali → ukázať, čo z ponuky majú
    return (B.offerStep === "before" ? viewOfferPick() + stepper : stepper + viewOfferPick()) + `
      ${after ? offerHints() : ""}
      ${noticeHtml()}
      ${navHtml()}`;
  }

  function viewMonth(first) {
    const y = first.getFullYear(), m = first.getMonth();
    const days = new Date(y, m + 1, 0).getDate();
    const lead = (first.getDay() + 6) % 7;          // pondelok = prvý stĺpec
    const today = ymd(now());
    let cells = "";
    for (let i = 0; i < lead; i++) cells += '<span class="rz-day empty" aria-hidden="true"></span>';
    for (let d = 1; d <= days; d++) {
      const date = y + "-" + pad(m + 1) + "-" + pad(d);
      const closed = !hoursFor(date), past = date < today || (!closed && !timesFor(date).length);
      const free = past || closed ? 0 : freeCount(date);
      const picked = sortedItems().filter(it => it.date === date).length;
      let cls = "rz-day", label = d + ". " + MONTHS[m], dis = false;
      if (past) { cls += " past"; dis = true; }
      else if (closed) { cls += " closed"; label += ", zatvorené"; dis = true; }
      else if (state.loaded && !free && !picked) { cls += " full"; label += ", obsadené"; dis = true; }
      if (date === state.day) cls += " active";
      if (date === today) cls += " today";
      if (picked) { cls += " has"; label += ", vybrané " + games(picked); }
      cells += `<button type="button" class="${cls}" data-act="day" data-date="${date}" aria-label="${label}" aria-pressed="${date === state.day}"${dis ? " disabled" : ""}>${d}${picked ? `<i>${picked}</i>` : ""}</button>`;
    }
    return `
      <div class="rz-month">
        <h3>${MONTHS[m]} ${y}</h3>
        <div class="rz-week" aria-hidden="true"><span>Po</span><span>Ut</span><span>St</span><span>Št</span><span>Pi</span><span>So</span><span>Ne</span></div>
        <div class="rz-grid">${cells}</div>
      </div>`;
  }

  function viewTimes() {
    if (!state.day) return '<p class="rz-hint">Vyberte deň v kalendári a ukážu sa voľné časy.</p>';
    if (!state.loaded) return '<p class="rz-hint">Načítavam voľné časy…</p>';
    const times = timesFor(state.day);
    if (!times.length) return `<p class="rz-hint">${hoursFor(state.day) ? "V tento deň už nie je voľný čas." : "V tento deň je zatvorené."}</p>`;
    const label = { free: "voľné", picked: "vybrané", busy: "obsadené", rest: "pauza" };
    const slots = times.map(t => {
      const st = statusOf(state.day, t), key = state.day + " " + t;
      const dis = st === "busy" || st === "rest";
      return `<button type="button" class="rz-slot ${st}" data-act="slot" data-key="${key}" aria-pressed="${st === "picked"}" aria-label="${t}, ${label[st]}"${dis ? " disabled" : ""}><b>${t}</b><small>${label[st]}</small></button>`;
    }).join("");
    return `
      <h3 class="rz-dayname" id="rz-times">${dayLabel(state.day)}</h3>
      <div class="rz-legend"><span class="free">voľné</span><span class="picked">vybrané</span><span class="busy">obsadené / pauza medzi vašimi hrami</span></div>
      <div class="rz-slots">${slots}</div>`;
  }

  /* balíček: začiatky v deň (voľný = všetky jeho hry voľné a iný balíček nezačína príliš blízko) */
  function viewPkgTimes(P) {
    if (!state.day) return '<p class="rz-hint">Vyberte deň v kalendári a ukážu sa voľné začiatky.</p>';
    if (!state.loaded) return '<p class="rz-hint">Načítavam voľné časy…</p>';
    const times = timesFor(state.day);
    if (!times.length) return `<p class="rz-hint">${hoursFor(state.day) ? "V tento deň už nie je voľný čas." : "V tento deň je zatvorené."}</p>`;
    const slots = times.map(t => {
      const picked = state.mStart === t && state.mDay === state.day, ok = picked || pkgStartOk(state.day, t, P, state.mOrder);
      const st = picked ? "picked" : ok ? "free" : "busy", lbl = picked ? "vybrané" : ok ? "začiatok" : "obsadené";
      return `<button type="button" class="rz-slot ${st}" data-act="pstart" data-time="${t}" aria-pressed="${picked}" aria-label="začiatok ${t}, ${lbl}"${ok ? "" : " disabled"}><b>${t}</b><small>${lbl}</small></button>`;
    }).join("");
    return `
      <h3 class="rz-dayname" id="rz-times">${dayLabel(state.day)} – kedy začnete?</h3>
      <div class="rz-legend"><span class="free">voľný začiatok</span><span class="picked">vybrané</span><span class="busy">obsadené</span></div>
      <div class="rz-slots">${slots}</div>`;
  }
  /* rozpis balíčka: hry a atrakcie */
  function pkgPlan(P, date, start, order) {
    const g = pkgGames(start, order, P), a = P.attrMin ? pkgAttr(start, order, P) : null;
    return [[esc(P.icon) + " " + esc(P.name), dayLabel(date) + " o " + start], ["🔫 Laser game", g.join(" · ")]]
      .concat(a ? [["🎮 " + esc(P.attrText || "Atrakcie"), "cca " + toTime(a[0]) + "–" + toTime(a[1])]] : []);
  }

  function viewTerm() {
    const P = curPkg();
    if (P) {
      const plan = state.mStart ? pkgPlan(P, state.mDay, state.mStart, state.mOrder) : null;
      return `
        <h2>Vyberte deň a začiatok</h2>
        <p class="rz-sub">${esc(P.icon)} ${esc(P.name)}: ${esc(pkgText(P))}. Stačí vybrať začiatok, hry vám rozpíšeme sami (každá ${B.game} min, medzi nimi pauza).</p>
        ${P.attrMin && P.games ? `<div class="rz-seg" role="group" aria-label="Poradie"><button type="button" class="${state.mOrder === "games" ? "on" : ""}" data-act="order" data-order="games" aria-pressed="${state.mOrder === "games"}">🔫 Najprv laser game</button><button type="button" class="${state.mOrder === "attr" ? "on" : ""}" data-act="order" data-order="attr" aria-pressed="${state.mOrder === "attr"}">🎮 Najprv ${esc(P.attrText || "atrakcie")}</button></div>` : ""}
        <div class="rz-months">${monthsShown().map(viewMonth).join("")}</div>
        <div class="rz-times">${viewPkgTimes(P)}</div>
        ${noticeHtml()}
        ${state.error ? `<p class="rz-status err" role="alert">${esc(state.error)}</p>` : ""}
        <div class="rz-picked">
          <h3>Váš balíček</h3>
          ${plan ? "<ul>" + plan.map(([a, b]) => `<li><span>${a}</span><b>${b}</b></li>`).join("") + "</ul>" : '<p class="rz-hint">Zatiaľ nemáte vybraný začiatok.</p>'}
        </div>
        ${navHtml("Pokračovať", !state.mStart)}`;
    }
    const items = sortedItems(), free = freeKeys();
    return `
      <h2>Vyberte deň a čas</h2>
      <p class="rz-sub">Jedna hra trvá ${B.game} minút. Môžete si vybrať aj viac hier, medzi nimi máte vždy pauzu na oddych.</p>
      <div class="rz-months">${monthsShown().map(viewMonth).join("")}</div>
      <div class="rz-times">${viewTimes()}</div>
      ${noticeHtml()}
      ${state.error ? `<p class="rz-status err" role="alert">${esc(state.error)}</p>` : ""}
      <div class="rz-picked">
        <h3>Vaše hry${items.length ? " (" + games(items.length) + ")" : ""}</h3>
        ${items.length
          ? "<ul>" + items.map(it => `<li><span>${itemLabel(it)}${free.has(it.date + " " + it.time) ? ' <em class="rz-free">zadarmo</em>' : ""}</span><button type="button" class="rz-link" data-act="remove" data-key="${it.date} ${it.time}">odstrániť</button></li>`).join("") + "</ul>"
          : '<p class="rz-hint">Zatiaľ nemáte vybraný žiadny čas.</p>'}
        ${offerHints()}
      </div>
      ${navHtml("Pokračovať", !items.length)}`;
  }

  function viewForm() {
    const items = sortedItems(), P = curPkg();
    const rows = P && state.mStart
      ? `<li><span>Počet ľudí</span><b>${state.players}</b></li>` + pkgPlan(P, state.mDay, state.mStart, state.mOrder).map(([a, b]) => `<li><span>${a}</span><b>${b}</b></li>`).join("")
      : `<li><span>Počet hráčov</span><b>${state.players}</b></li>
        ${offerStepOn() && state.offerPick ? `<li><span>Vybraná ponuka</span><b>${state.offerPick === "none" ? "len laser game" : "🎁 " + esc(state.offerPick)}</b></li>` : ""}
        <li><span>${items.length > 1 ? "Hry" : "Hra"}</span><b>${items.map(it => itemLabel(it) + (freeKeys().has(it.date + " " + it.time) ? " (zadarmo)" : "")).join("<br>")}</b></li>
        ${freeKeys().size ? `<li><span>Ponuka ${offerName(cur())}</span><b>${games(freeKeys().size)} zadarmo</b></li>` : ""}`;
    return `
      <h2>Vaše údaje</h2>
      <ul class="rz-summary">
        ${rows}
        <li><span>Platba</span><b>na mieste</b></li>
      </ul>
      ${P ? "" : offerHints()}
      <form class="rz-form" novalidate>
        <label>Meno a priezvisko<input name="name" required minlength="3" maxlength="80" autocomplete="name"></label>
        <div class="rz-row">
          <label>Telefón<input name="phone" type="tel" required maxlength="30" autocomplete="tel" placeholder="0910 123 456"></label>
          <label>E-mail<input name="email" type="email" required maxlength="100" autocomplete="email"></label>
        </div>
        <label class="rz-check"><input type="checkbox" name="consent" required>
          <span>Súhlasím so <a href="${esc(B.privacyUrl)}" target="_blank" rel="noopener">spracovaním osobných údajov</a> na účely rezervácie.</span></label>
        <p class="rz-status" role="status" aria-live="polite"></p>
        <div class="rz-nav"><button type="button" class="rz-btn ghost" data-act="back">Späť</button><button type="submit" class="rz-btn">Dokončiť rezerváciu</button></div>
      </form>`;
  }

  function viewDone() {
    const d = state.done;
    return `
      <div class="rz-done">
        <div class="rz-done-icon" aria-hidden="true">✓</div>
        <h2>Rezervácia je potvrdená</h2>
        <p>${d.pkg ? esc(d.pkgIcon || "🎁") + " " + esc(d.pkg) + " · " + people(d.players) : players(d.players)}</p>
        <ul>${d.items.map(it => "<li>" + itemLabel(it) + "</li>").join("")}</ul>
        ${d.attr ? `<p>${d.attr}</p>` : ""}
        <p class="rz-sub">${d.mailed
          ? "Potvrdenie sme poslali na <b>" + esc(d.email) + "</b>. Ak ho nevidíte, pozrite aj priečinok spam."
          : "Tešíme sa na vás. Ak potrebujete niečo zmeniť, zavolajte nám na " + esc(B.phone) + "."}</p>
        <button type="button" class="rz-btn ghost" data-act="again">Nová rezervácia</button>
      </div>`;
  }

  function testBanner() {
    if (!store || store.mode !== "test") return "";
    return `<p class="rz-test">Testovací režim: rezervácie sa ukladajú len v tomto prehliadači. <button type="button" class="rz-link" data-act="reset">Vymazať testovacie rezervácie</button></p>`;
  }

  function render() {
    let body;
    if (state.step === "done") body = viewDone();
    else body = stepsBar() + (state.step === "what" ? viewWhat() : state.step === "players" ? viewPlayers() : state.step === "term" ? viewTerm() : viewForm());
    root.innerHTML = testBanner() + `<div class="rz-card">${body}</div>` + (state.step !== "done" ? offerModal() : "");
    if (state.offerModal) {
      const yes = root.querySelector('[data-act="offer-yes"]');
      if (yes) yes.focus({ preventScroll: true });
      focusKey = null;
    }
    if (focusKey) {
      const el = root.querySelector(`[data-key="${focusKey}"]`) || root.querySelector(`[data-date="${focusKey}"]`) || root.querySelector(`[data-time="${focusKey}"]`);
      if (el) el.focus({ preventScroll: true });
      focusKey = null;
    }
  }

  function goStep(n) {
    state.step = n;
    state.moved = true;
    state.notice = "";
    render();
    if (root.getBoundingClientRect().top < 0) root.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  /* Pred posledným krokom (údaje) pripomenúť ponuku – ktorú majú, alebo na ktorú im chýbajú ľudia. */
  function goNext() {
    const s = state.step, next = nextStep();
    if (s === "what" && !state.what) { state.notice = "Vyberte, čo si rezervujete."; render(); return; }
    if (s === "players" && offerStepOn() && state.offerPick === null) { state.notice = "Vyberte si ponuku (alebo „Len laser game“)."; render(); return; }
    if (s === "term" && !state.selected.size) return;
    if (next === "form" && !curPkg()) {
      const o = cur(), n = nextOffer(), day = offerDay(o) || offerDay(n);
      if (day) { state.offerModal = offerDay(o) ? { date: day, kind: "continue", o } : { date: day, kind: "friends", o: n }; render(); return; }
    }
    goStep(next);
  }

  /* ============ OVLÁDANIE ============ */
  root.addEventListener("click", e => {
    const b = e.target.closest("[data-act]");
    if (!b || b.disabled) return;
    const act = b.dataset.act;

    if (act === "minus" || act === "plus") {
      state.players = clampPl(state.players + (act === "plus" ? 1 : -1));
      render();
    } else if (act === "what") {
      const v = b.dataset.what;
      if (v !== state.what) {
        state.what = v;
        clearStart(); state.offerPick = null; state.offerShown.clear();
        const P = curPkg();
        state.players = clampPl(P ? P.players : state.players);
      }
      state.notice = "";
      goNext();
    } else if (act === "pick") { state.offerPick = b.dataset.pick; state.notice = ""; render(); }
    else if (act === "next") goNext();
    else if (act === "back") goStep(prevStep());
    else if (act === "day") {
      state.day = b.dataset.date;
      state.notice = "";
      focusKey = state.day;
      render();
      const times = document.getElementById("rz-times");
      if (times && times.getBoundingClientRect().top > window.innerHeight - 120) times.scrollIntoView({ behavior: "smooth", block: "start" });
    } else if (act === "pstart") {
      state.notice = "";
      pickStart(state.day, b.dataset.time);
      focusKey = b.dataset.time;
      render();
    } else if (act === "order") {
      state.mOrder = b.dataset.order === "attr" ? "attr" : "games";
      state.notice = "";
      const P = curPkg();
      if (P && state.mStart) {
        if (pkgStartOk(state.mDay, state.mStart, P, state.mOrder)) pickStart(state.mDay, state.mStart);
        else { state.notice = "Pri tomto poradí nie je začiatok o " + state.mStart + " voľný, vyberte prosím iný."; clearStart(); }
      }
      render();
    } else if (act === "slot") {
      const key = b.dataset.key, [date, time] = key.split(" ");
      state.notice = "";
      if (state.selected.has(key)) state.selected.delete(key);
      else if (state.selected.size >= B.maxGames) state.notice = "V jednej rezervácii môžete mať najviac " + games(B.maxGames) + ". Pre viac nám zavolajte na " + B.phone + ".";
      else {
        state.selected.set(key, { date, time });
        // 3 hry v jeden deň a aspoň 8 hráčov → ponúknuť 4. hru zadarmo (raz pre daný deň)
        const o = cur();
        if (o && gamesPerDay()[date] % bundleOf(o) === o.paid && !state.offerShown.has(date)) {
          state.offerShown.add(date);
          state.offerModal = { date, kind: "pick", o };
        }
      }
      focusKey = key;
      render();
    } else if (act === "offer-yes" || act === "offer-no" || act === "offer-players") {
      const m = state.offerModal;
      state.offerModal = null;
      if (act === "offer-players") { goStep("players"); return; }
      if (act === "offer-no" && m && m.kind !== "pick") { goStep("form"); return; }   // pri Pokračovať: ísť ďalej bez ponuky
      if (act === "offer-yes" && m) { state.day = m.date; if (state.step !== "term") { goStep("term"); } else render(); }
      else render();
      if (act === "offer-yes") {
        const el = document.getElementById("rz-times");
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    } else if (act === "remove") { state.selected.delete(b.dataset.key); render(); }
    else if (act === "again") {
      state.done = null; clearStart(); state.offerShown.clear(); state.day = null; state.offerPick = null; state.mOrder = "games";
      state.what = webPkgs().length ? null : "laser"; state.players = clampPl(B.minPlayers);
      goStep(steps()[0]);
    }
    else if (act === "reset" && store && store.reset) { store.reset(); clearStart(); render(); }
  });

  root.addEventListener("submit", e => { e.preventDefault(); submit(e.target); });

  function normalizePhone(p) {
    p = p.replace(/[\s\-/()]/g, "");
    if (p.startsWith("00")) return "+" + p.slice(2);
    if (p.startsWith("0")) return "+421" + p.slice(1);
    return p;
  }

  /* E-maily pošle WordPress (admin-ajax.php, akcia cpr_mail): potvrdenie zákazníkovi a upozornenie nám – čo sa pošle,
     nastavuje vedúci v appke. Rezervácia je už uložená, takže keď e-mail zlyhá, len to zákazníkovi nepovieme.
     Vracia true, keď odišlo potvrdenie zákazníkovi. */
  async function sendMail(id, data) {
    const body = new FormData();
    body.append("action", "cpr_mail");
    body.append("id", id);
    body.append("email", data.email);
    body.append("name", data.name);
    body.append("phone", data.phone);
    body.append("players", String(data.players));
    if (data.pkg) { body.append("pkg", data.pkg); body.append("mStart", data.mStart); body.append("mOrder", data.mOrder); }
    Object.keys(data.games).forEach(g => body.append("games[]", g));
    const ctrl = typeof AbortController === "function" ? new AbortController() : null;
    const timer = ctrl && setTimeout(() => ctrl.abort(), 12000);
    try {
      const res = await fetch(CFG.mailUrl, { method: "POST", body, credentials: "same-origin", signal: ctrl ? ctrl.signal : undefined });
      const json = await res.json().catch(() => null);
      return !!(res.ok && json && json.success && (json.data === "sent" || (json.data && json.data.customer)));
    } catch (e) { console.error("[rezervácia] e-mail", e); return false; }
    finally { if (timer) clearTimeout(timer); }
  }

  async function submit(form) {
    if (state.sending) return;
    const status = form.querySelector(".rz-status");
    const say = (text, type) => { status.textContent = text; status.className = "rz-status" + (type ? " " + type : ""); };
    if (!form.reportValidity()) return;

    const f = new FormData(form);
    const c = { name: f.get("name").trim(), email: f.get("email").trim(), phone: normalizePhone(f.get("phone").trim()) };
    if (!/^\+?\d{9,15}$/.test(c.phone)) { say("Skontrolujte prosím telefónne číslo.", "err"); form.phone.focus(); return; }

    const items = sortedItems(), btn = form.querySelector('[type="submit"]'), P = curPkg();
    if (P ? !state.mStart || !pkgStartOk(state.mDay, state.mStart, P, state.mOrder) : items.some(it => takenByOthers(it.date, it.time))) { dropTaken(); goStep("term"); return; }

    const gamesMap = {};
    items.forEach(it => { gamesMap[it.date + "_" + it.time.replace(":", "")] = true; });
    const data = { name: c.name, phone: c.phone, email: c.email, players: state.players, games: gamesMap, consent: true };
    let pk = null, attr = "";
    if (P) {
      Object.assign(data, { pkg: P.id, mStart: state.mStart, mOrder: state.mOrder });
      const w = pkgWin(state.mStart, state.mOrder, P);
      pk = { date: state.mDay, key: hm(w[0]) + "_" + hm(w[1]) };
      if (P.attrMin) { const a = pkgAttr(state.mStart, state.mOrder, P); attr = "🎮 " + esc(P.attrText || "Atrakcie") + " cca " + toTime(a[0]) + "–" + toTime(a[1]); }
    } else if (offerStepOn() && state.offerPick) data.offerPick = state.offerPick;   // čo si zákazník vybral (appka to ukáže)

    state.sending = true; btn.disabled = true; say("Odosielam rezerváciu…");
    try {
      const id = await store.book(items, data, pk);
      let mailed = false;
      if (CFG.mailUrl && store.mode === "firebase") {
        if (B.mailCustomer !== undefined ? B.mailCustomer !== false : B.emailToCustomer) say("Posielam potvrdenie na e-mail…");
        mailed = await sendMail(id, data);
      }
      state.done = { items, email: c.email, players: state.players, mailed, pkg: P ? P.name : "", pkgIcon: P ? P.icon : "", attr };
      clearStart();
      goStep("done");
    } catch (err) {
      console.error("[rezervácia]", err);
      if (err.code === "taken") say(P ? "Tento začiatok si medzitým rezervoval niekto iný. Vráťte sa späť a vyberte iný, alebo nám zavolajte na " + B.phone + "."
        : "Niektorý z vybraných časov si medzitým rezervoval niekto iný. Vráťte sa späť a vyberte iný čas.", "err");
      else say("Rezerváciu sa nepodarilo odoslať. Skúste to znova alebo nám zavolajte na " + B.phone + ".", "err");
    } finally {
      state.sending = false;
      if (btn.isConnected) btn.disabled = false;
    }
  }

  init();
})();
</script>
